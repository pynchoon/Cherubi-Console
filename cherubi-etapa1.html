 pluma:{name:'Pluma Angelical',base:1,themes:['palido','oscuro','rosado'],img:{palido:'https://i.ibb.co/xkFjffC/3-removebg-preview.png',oscuro:'https://i.ibb.co/TBD4nsBC/Chat-GPT-Image-19-sept-2026-20-16-32.png',rosado:'https://i.ibb.co/SX9VLj3n/5-removebg-preview.png'}},

var CATS=['Generales','Visor de Estrellas','Generador de Números','Cocina','Ritmos','Jardín','Star Collector','Lucky Cherub','Tragamonedas','Secretos'];

/* [categoría, nombre, condición, tipo p/n/s, recompensa, estado(1=activo ahora | etapa | 'nv' | 'def'), descripción] */

[0,'Home Sweet Home','Cambiar el tema de un perfil por primera vez.','p'],

[1,'Nocturnal','Abrir el visor durante la noche (20:00 a 06:00).','p',0,2],
[1,'Secuestra estrellas','Vender las primeras estrellas obtenidas.','p',0,2,'Has traficado estrellas ilegalmente.'],

[2,'Oddly Specific','Obtener el número 117 tres veces.','p'],
[3,'Little Chef','Jugar por primera vez (abrir un juego de cocina).','p',0,3],
[3,'Perfect Recipe','Completar un nivel con puntuación perfecta.','p',0,'nv'],

[5,'Botanical','Conseguir 5 especies diferentes.','p',0,4],
[5,'Neglectful Angel','Dejar que una planta se marchite.','n',0,4],
[5,'Garden Paradise','Tener 10 plantas creciendo simultáneamente.','p',0,4],
[6,'Catch Me!','Atrapar la primera estrella.','p',0,3],

[6,'Untouchable','Terminar una partida sin perder vidas.','p',0,3],
[6,'Sky Champion','Superar un récord determinado.','p',0,3],
[7,'First Prize','Obtener el primer premio.','p',0,3],
[7,'Jackpot!','Conseguir un premio de máxima rareza.','p',0,3],

var AM={},ach=ACH.map(function(a){var o={c:a[0],n:a[1],d:a[2],t:a[3],r:a[4]||0,st:a[5]||1,f:a[6]||''};AM[o.n]=o;return o;});
var APPS=[ /* [id, icono, título, etapa, render, descripción futura] */
['perfiles','♡','Perfiles',1,appPerfiles],['logros','🏆','Logros',1,appLogros],['inventario','🎒','Inventario',1,appInv],
['numeros','🔢','Generador de Números',1,appNum],['notas','📝','Notas',1,appNotes],
['estrellas','★','Visor de Estrellas',2,null,'Cielo nocturno interactivo para capturar y vender estrellas.'],
['tragamonedas','🎰','Tragamonedas',2,null,'Máquina con apuestas, historial y premios.'],
['tienda','🛒','Tienda',2,null,'Juegos, objetos y coleccionables a cambio de pepitas.'],
['cocina','🍳','Cocina',3,null,'Devilish Cooking y Papa\'s Sushiria (iframe o pestaña nueva).'],
['starcollector','🧺','Star Collector',3,null,'Atrapá estrellas que caen y evitá los obstáculos.'],
['lucky','🧸','Lucky Cherub',3,null,'Máquina de premios con garra.'],
['ritmo','🎵','Ritmos',4,null,'Juego de ritmo original con música.'],
['jardin','🌸','Jardín',4,null,'Cultivá flores y colecciónalas.']
];
/* ================= CORE ================= */
var S,R,cur=null,TI,T1,H={},Q=[];
function def(){return{v:1,coins:0,claimed:{},ach:{},inv:{},bought:[],days:[],last:0,opens:0,prof:{},unlocked:{loto:0,pastel:0},active:null,notes:[],notesSel:null,num:{n:0,seen:{},hist:[],c117:0},app:{}};}
function load(){try{var r=JSON.parse(localStorage.getItem(CFG.key));if(r&&r.v){var d=def();for(var k in r)d[k]=r[k];return d;}}catch(e){}return null;}
function save(){try{localStorage.setItem(CFG.key,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s){return R.querySelector(s);}
function on(e,f){(H[e]=H[e]||[]).push(f);}
function emit(e,d){(H[e]||[]).forEach(function(f){f(d);});}
async function hash(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cherubi:'+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}catch(e){var h=5381;s='cherubi:'+s;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return 'f'+h.toString(16);}}
function toast(m){var t=$('.toasts');if(!t){Q.push(m);return;}var d=document.createElement('div');d.className='ts';d.textContent=m;t.appendChild(d);setTimeout(function(){d.remove();},3800);}
function unlock(n){var a=AM[n];if(!a||S.ach[n])return;S.ach[n]=Date.now();save();toast('🏆 '+(a.t==='s'?'Logro secreto: ':'Logro: ')+a.n+(a.r?' (+'+a.r+' pepitas)':''));if(a.r)claim('ach:'+n,a.r);emit('ach',n);if(cur==='logros')render('logros');}
function claim(k,n){if(S.claimed[k])return false;S.claimed[k]=1;S.coins+=n;save();after();return true;}
function add(n){S.coins+=n;save();after();}
function spend(n,o){if(S.coins<n){if(o&&o.purchase)unlock('Whoops!');return false;}S.coins-=n;save();after();return true;}
function addItem(id,q){S.inv[id]=(S.inv[id]||0)+(q||1);save();checkAch();if(cur==='inventario')render('inventario');}
function after(){updateBar();checkAch();}
function checkAch(){
 if(!S.active)return;
 if(S.coins>=500)unlock('Silver Fever');if(S.coins>=1000)unlock('Capitalista');
 if(S.coins===0&&S.claimed.init)unlock('Broke Angel');
 if(Object.keys(S.inv).length>=5)unlock('Little Collector');
 if(S.days.length>=7)unlock('Digital Resident');
 if(S.bought.length>=5)unlock('Shopaholic');
 for(var k in S.prof){if(S.prof[k].cu>0&&S.prof[k].cp>0)unlock('Identity Crisis');}
}
function unlockProfile(id){if(PROFILES[id]&&!PROFILES[id].base&&!S.unlocked[id]){S.unlocked[id]=1;save();unlock('A New Face');if(cur==='perfiles')render('perfiles');}}
/* ================= UI BASE ================= */
function view(h){$('.cb').innerHTML=h;}
function modal(h){closeM();var m=document.createElement('div');m.className='mod';m.innerHTML='<div class="card w">'+h+'</div>';m.addEventListener('click',function(e){if(e.target===m||e.target.getAttribute('data-x')!==null)closeM();});$('.cb').appendChild(m);return m;}
function closeM(){var m=$('.mod');if(m)m.remove();}
function ask(msg){return new Promise(function(r){var m=modal('<p>'+msg+'</p><div class="row"><button class="bt" data-y>Confirmar</button><button class="bt g" data-x>Cancelar</button></div>');m.querySelector('[data-y]').onclick=function(){closeM();r(true);};m.addEventListener('click',function(e){if(e.target===m||e.target.getAttribute('data-x')!==null)r(false);});});}
function pimg(id){var d=S.prof[id];return PROFILES[id].img[d?d.theme:PROFILES[id].themes[0]];}
function theme(){var p=S.prof[S.active];$('.cb').setAttribute('data-theme',p?p.theme:'palido');}
function picks(ids,sub){return '<div class="row">'+ids.map(function(id,i){return '<label class="pick"><input type="radio" name="p" value="'+id+'"'+(i?'':' checked')+'><img src="'+PROFILES[id].img[PROFILES[id].themes[0]]+'" alt=""><span>'+esc(PROFILES[id].name)+'</span>'+(sub?'<small>'+esc(S.prof[id].user)+'</small>':'')+'</label>';}).join('')+'</div>';}
async function mk(id,u,p){S.prof[id]={user:u,hash:await hash(p),theme:PROFILES[id].themes[0],cu:0,cp:0};save();}
function renderCreate(){
 view('<div class="center"><form class="card w" id="f"><h2>CHERUBI</h2><p>Creá tu primer perfil</p>'+picks(['nota','pluma'])+'<input id="u" placeholder="Usuario" required maxlength="20"><input id="pw" type="password" placeholder="Contraseña" required><p class="msg">Tu progreso se guarda solo en este navegador.</p><button class="bt">Crear y entrar</button></form></div>');
 $('#f').onsubmit=async function(e){e.preventDefault();var id=$('input[name=p]:checked').value,u=$('#u').value.trim();if(!u)return;await mk(id,u,$('#pw').value);S.active=id;claim('init',CFG.startCoins);unlock('First Boot');enter();};
}
function renderLogin(){
 view('<div class="center"><form class="card w" id="f"><h2>Iniciar sesión</h2>'+picks(Object.keys(S.prof),1)+'<input id="pw" type="password" placeholder="Contraseña" required><p class="err" id="er"></p><button class="bt">Entrar</button></form></div>');
 $('#f').onsubmit=async function(e){e.preventDefault();var id=$('input[name=p]:checked').value;if(await hash($('#pw').value)===S.prof[id].hash){S.active=id;enter();}else $('#er').textContent='Usuario o contraseña incorrectos.';};
}
function enter(){
 var now=new Date(),prev=S.last;S.last=Date.now();S.opens++;
 var day=now.toLocaleDateString('sv');if(S.days.indexOf(day)<0)S.days.push(day);save();
 goHome();
 if(prev&&Date.now()-prev>=30*864e5){unlock('The Forgotten One');modal('<h3>Bienvenido/a de vuelta</h3><p>Pasó mucho tiempo desde tu última visita. Cherubi te estuvo esperando.</p><button class="bt" data-x>Entrar</button>');}
 if(now.getHours()===3&&now.getMinutes()===33)unlock('03:33');
 clearTimeout(T1);T1=setTimeout(function(){unlock('Are You Still There?');},36e5);
 checkAch();
}
function goHome(){
 view('<div class="lay"><div class="side">'+APPS.map(function(a){var p=a[3]>1&&!a[4];return '<div class="ic'+(p?' pend':'')+'" data-a="'+a[0]+'" title="'+esc(a[2])+'"'+(p?' data-st="E'+a[3]+'"':'')+'>'+(a[0]==='perfiles'?'<img id="sp" src="'+pimg(S.active)+'" alt="">':a[1])+'</div>';}).join('')+'</div><div class="main"><div class="bar"><span id="coins" class="chip"></span><span id="date"></span><span id="time"></span><span class="chip"><img id="bp" src="" alt=""><span id="bnm"></span></span><button class="bt g sm" id="lo">Salir</button></div><div class="area" id="ar"></div></div></div><div class="toasts"></div>');
 theme();updateBar();cur=null;
 $('.side').onclick=function(e){var el=e.target.closest('.ic');if(el)openApp(el.getAttribute('data-a'));};
 $('#lo').onclick=function(){clearInterval(TI);clearTimeout(T1);cur=null;renderLogin();};
 $('#ar').innerHTML='<div class="card"><h3>¡Bienvenido/a!</h3><p>Elegí una aplicación en la barra lateral.</p></div>';
 clearInterval(TI);TI=setInterval(updateBar,1000);
 while(Q.length)toast(Q.shift());
}
function updateBar(){
 var c=$('#coins');if(!c)return;c.textContent='✦ '+S.coins+' pepitas';c.className='chip'+(S.coins===0&&S.claimed.init?' sad':'');
 var d=new Date();$('#time').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString();
 $('#bp').src=pimg(S.active);$('#bnm').textContent=PROFILES[S.active].name+' · '+S.prof[S.active].user;
 var sp=$('#sp');if(sp)sp.src=pimg(S.active);
}
function openApp(id){
 if(cur&&cur!==id){S.app[cur]=(S.app[cur]||0)+1;save();if(S.app[cur]>=10)unlock('Déjà Vu');}
 cur=id;R.querySelectorAll('.ic').forEach(function(e){e.classList.toggle('on',e.getAttribute('data-a')===id);});render(id);
}
function render(id){
 var A=APPS.filter(function(a){return a[0]===id;})[0],b=$('#ar');if(!A||!b)return;
 if(!A[4]){b.innerHTML='<div class="card"><h3>'+esc(A[2])+'</h3><p><b>Etapa '+A[3]+': todavía no desarrollada.</b></p><p>'+esc(A[5]||'')+'</p></div>';return;}
 A[4](b);
}
/* ================= APPS ================= */
function appPerfiles(b){
 var a=S.active,h='<h3>Perfiles</h3><div class="grid">';
 for(var id in PROFILES){var P=PROFILES[id],d=S.prof[id];
  if(!P.base&&!S.unlocked[id]){h+='<div class="card lk"><div class="si">?</div><b>???</b><small>Perfil secreto bloqueado</small></div>';continue;}
  h+='<div class="card'+(a===id?' on':'')+'"><img class="pi" src="'+pimg(id)+'" alt=""><b>'+esc(P.name)+'</b>'+(d?(a===id?'<small>Perfil activo</small>':'<button class="bt sm" data-sw="'+id+'">Usar</button>'):'<button class="bt sm" data-mk="'+id+'">Crear perfil</button>')+'</div>';}
 var p=S.prof[a],P2=PROFILES[a];
 h+='</div><h4>Perfil activo: '+esc(P2.name)+'</h4><div class="card"><p>Usuario: <b>'+esc(p.user)+'</b></p><div class="row"><button class="bt sm" data-ed="user">Cambiar usuario ('+CFG.profileCost+')</button><button class="bt sm" data-ed="pass">Cambiar contraseña ('+CFG.profileCost+')</button></div>';
 if(P2.themes.length>1)h+='<p>Tema:</p><div class="row">'+P2.themes.map(function(t){return '<button class="bt sm'+(p.theme===t?'':' g')+'" data-th="'+t+'">'+TL[t]+'</button>';}).join('')+'</div>';
 h+='</div><button class="bt g" id="ts">¿Qué perfil me corresponde?</button>';
 b.innerHTML=h;
 b.onclick=function(e){var t=e.target,v;
  if((v=t.getAttribute('data-sw'))){S.active=v;save();theme();updateBar();render('perfiles');}
  else if((v=t.getAttribute('data-mk')))newProfile(v);
  else if((v=t.getAttribute('data-ed')))editCred(v);
  else if((v=t.getAttribute('data-th'))){if(S.prof[a].theme!==v){S.prof[a].theme=v;save();unlock('Home Sweet Home');theme();updateBar();render('perfiles');}}
  else if(t.id==='ts')testPerfil();};
}
function newProfile(id){
 var m=modal('<h3>Crear '+esc(PROFILES[id].name)+'</h3><form id="nf"><input id="nu" placeholder="Usuario" required maxlength="20"><input id="np" type="password" placeholder="Contraseña" required><p class="msg">Crear un perfil es gratis.</p><div class="row"><button class="bt">Crear</button><button type="button" class="bt g" data-x>Cancelar</button></div></form>');
 m.querySelector('#nf').onsubmit=async function(e){e.preventDefault();var u=m.querySelector('#nu').value.trim();if(!u)return;await mk(id,u,m.querySelector('#np').value);closeM();render('perfiles');toast('Perfil creado');};
}
function editCred(kind){
 var m=modal('<h3>Cambiar '+(kind==='user'?'usuario':'contraseña')+'</h3><form id="ef"><input id="nv"'+(kind==='user'?'':' type="password"')+' required maxlength="30" placeholder="Nuevo valor"><p class="msg">Costo: '+CFG.profileCost+' pepitas de plata.</p><p class="err" id="ee"></p><div class="row"><button class="bt">Continuar</button><button type="button" class="bt g" data-x>Cancelar</button></div></form>');
 m.querySelector('#ef').onsubmit=async function(e){e.preventDefault();var v=m.querySelector('#nv').value;if(kind==='user')v=v.trim();if(!v)return;
  if(S.coins<CFG.profileCost){m.querySelector('#ee').textContent='No tenés suficientes pepitas de plata.';return;}
  closeM();if(!(await ask('Cambiar '+(kind==='user'?'el usuario':'la contraseña')+' costará '+CFG.profileCost+' pepitas de plata. ¿Confirmás?')))return;
  if(!spend(CFG.profileCost))return;var p=S.prof[S.active];
  if(kind==='user'){p.user=v;p.cu++;}else{p.hash=await hash(v);p.cp++;}
  save();checkAch();updateBar();render('perfiles');toast('Datos actualizados');};
}
function testPerfil(){
 function q(n,t,o){return '<p>'+t+'</p>'+o.map(function(x,i){return '<label class="op"><input type="radio" name="q'+n+'" value="'+'ABC'[i]+'"> '+x+'</label>';}).join('');}
 var m=modal('<h3>¿Qué perfil me corresponde?</h3><form id="tf">'+q(1,'1. ¿Qué tipo de ambiente preferís para tu consola?',['Suave, luminoso y delicado.','Alegre, musical y con bastante movimiento.','Algo intermedio: tranquilo, pero con detalles que llamen la atención.'])+q(2,'2. ¿Qué te gustaría que destacara más en tu perfil?',['La estética, los detalles y la sensación de calma.','Los sonidos, las animaciones y los elementos interactivos.','Una combinación equilibrada de ambos.'])+'<p class="msg">Es solo una sugerencia: no cambia tu perfil.</p><p id="tr"></p><div class="row"><button class="bt">Ver resultado</button><button type="button" class="bt g" data-x>Cerrar</button></div></form>');
 m.querySelector('#tf').onsubmit=function(e){e.preventDefault();var a=m.querySelector('input[name=q1]:checked'),c=m.querySelector('input[name=q2]:checked'),t=m.querySelector('#tr');
  if(!a||!c){t.textContent='Respondé las dos preguntas.';return;}
  var k=a.value+c.value,id=k==='AA'?'pluma':k==='BB'?'nota':null;
  t.innerHTML=id?'Te corresponde <b>'+PROFILES[id].name+'</b>.<br><img class="pi" src="'+PROFILES[id].img.palido+'" alt="">':'Resultado mixto: ambos perfiles te quedan bien, elegí el que prefieras.';};
}
function appLogros(b){
 var n=ach.filter(function(a){return S.ach[a.n];}).length,TT={p:'Positivo',n:'Negativo',s:'Secreto'};
 var h='<h3>Emblemas y logros</h3><p>'+n+' / '+ach.length+' desbloqueados</p>';
 CATS.forEach(function(c,i){h+='<h4>'+c+'</h4><div class="grid">'+ach.filter(function(a){return a.c===i;}).map(function(a){
  var u=S.ach[a.n];
  if(a.t==='s'&&!u)return '<div class="card lk"><div class="si">?</div><b>???</b><small>Logro secreto</small></div>';
  return '<div class="card bd'+(u?' got':'')+'"><b>'+esc(a.n)+'</b><small>'+TT[a.t]+' · '+esc(c)+'</small><p>'+esc(a.f||a.d)+'</p>'+(a.f?'<small>Condición: '+esc(a.d)+'</small>':'')+(a.r?'<small>Recompensa: '+a.r+' pepitas</small>':'')+'<small>'+(u?'✔ Desbloqueado '+new Date(u).toLocaleDateString():'🔒 Bloqueado'+(a.st!==1?' · '+ST[a.st]:''))+'</small></div>';}).join('')+'</div>';});
 b.innerHTML=h;
}
function appInv(b){

function appNotes(b){
