function sha256(s){var mp=Math.pow,mw=mp(2,32),i,j,r='',w=[],bl=s.length*8,h=[],k=[],pc=0,ic={};
 for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
 s+='\x80';while(s.length%64-56)s+='\x00';
 for(i=0;i<s.length;i++){j=s.charCodeAt(i);w[i>>2]|=j<<((3-i)%4)*8;}
 w[w.length]=(bl/mw)|0;w[w.length]=bl;
 for(j=0;j<w.length;){var x=w.slice(j,j+=16),o=h;h=h.slice(0,8);
  for(i=0;i<64;i++){var w15=x[i-15],w2=x[i-2],a=h[0],e=h[4],
   t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(x[i]=(i<16)?x[i]:(x[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+x[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))|0)),
   t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
   h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;}
  for(i=0;i<8;i++)h[i]=(h[i]+o[i])|0;}
 for(i=0;i<8;i++)for(j=3;j+1;j--){var q=(h[i]>>(j*8))&255;r+=((q<16)?0:'')+q.toString(16);}
 return r;}
